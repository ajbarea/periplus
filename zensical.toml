[project]
site_name = "Periplus"
site_description = "An offline-first travel-itinerary planner you install to your phone. Fork it for your own multi-week trip."
site_author = "AJ Barea"
site_url = "https://ajbarea.github.io/periplus/"
repo_url = "https://github.com/ajbarea/periplus"
repo_name = "ajbarea/periplus"
copyright = "AJ Barea"
extra_css = [
  "stylesheets/variables.css",
  "stylesheets/base.css",
  "stylesheets/landing.css",
]
extra_javascript = ["javascripts/reveal.js"]

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav = [
  { "Home" = "index.md" },
  { "Features" = "features.md" },
  { "Install & Use" = "install.md" },
  { "Customize" = "customize.md" },
  { "Tech Notes" = "tech-notes.md" },
]

# ---------------------------------------------------------------------------
# Theme & Visuals
# ---------------------------------------------------------------------------
[project.theme]
name = "material"
language = "en"
custom_dir = "overrides"
favicon = "assets/favicon.png"
icon.logo = "material/map-marker-path"
font.text = "Inter"
font.code = "JetBrains Mono"

features = [
    "content.code.copy",
    "content.code.annotate",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "search.share",
    "toc.follow",
]

# Light and dark follow the reader's system setting; the toggle overrides it. Every colour
# is a token in docs/stylesheets/variables.css.
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
[project.plugins]
# zensical 0.0.60 moved search into Rust and removed `engine`; setting it
# now aborts the build with "unknown search option: engine".
search = {}

# ---------------------------------------------------------------------------
# Social & Metadata
# ---------------------------------------------------------------------------
[project.extra]
generator = false
og_image = "assets/og.jpg"
brand_mark = "assets/brand.png"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ajbarea/periplus"
name = "Periplus on GitHub"
